[project]
name = "Eccelerators.RiscV"
version = "0.2.1"
description = "Composable RV32I and Zmmul processors, machine-mode support, and reusable FPGA system components written in Livt."
authors = ["Denis Vasilík"]
repository = "https://github.com/eccelerators/eccelerators-riscv"
homepage = "https://github.com/eccelerators/eccelerators-riscv"
keywords = ["fpga", "riscv", "rv32i", "processor", "cpu"]
license = "MIT"
path = "src"
outdir = "out"

[project.organization]
name = "Eccelerators GmbH"
website = "https://eccelerators.com"

[publish]
files = ["README.md", "CHANGELOG.md", "LICENSE"]

[tests]
path = "tests"
components = [
    "RvSystemTest",
    "Rv32ZicsrAccessTest",
    "Rv32PipelineZmmulEngineTest",
    "Rv32PipelineDspEngineTest",
    "Rv32PipelineCsrEngineTest",
    "Rv32PipelineTrapEngineTest",
    "Rv32PipelineTimerInterruptTest",
    "Rv32PipelineExternalInterruptTest",

    "Rv32PipelineEngineTest",
    "Rv32PipelineControlTest",
    "Rv32DualReadRegisterBankTest",
    "Rv32DualReadDistributedTest",
    "Rv32InterruptCsrTest",
    "RvExternalInterruptsTest",
    "Rv32ExternalInterruptTest",
    "RvMachineTimerTest",
    "Rv32TimerInterruptTest",
    "Rv32TrapEngineTest",
    "Rv32MachineDecoderTest",
    "Rv32TrapPolicyTest",
    "Rv32MachineCsrsTest",
    "Rv32ZicsrDecoderTest",
    "Rv32CsrEngineTest",
    "Rv32ZmmulDecodeTest",
    "Rv32IterativeMultiplierTest",
    "Rv32DspMultiplierTest",
    "Rv32DspEngineTest",
    "Rv32DspControlTest",
    "Rv32ZmmulEngineTest",
    "Rv32ZmmulControlTest",
    "Rv32SequentialEngineTest",
    "Rv32SequentialControlTest",
    "Rv32iConstantsTest",
    "Rv32iInstructionFieldsTest",
    "Rv32iImmediateDecoderTest",
    "Rv32iRegisterFileTest",
    "Rv32iRegisterStorageTest",
    "Rv32iRamCoreTest",
    "Rv32iAluTest",
    "Rv32iBranchUnitTest",
    "Rv32iLoadStoreUnitTest",
    "Rv32iControlDecoderTest",
    "Rv32iCoreInstructionTest",
    "Rv32SimpleMemoryTest",
    "Rv32iMinimalSystemTest",
    "Rv32iFullDecodeMatrixTest",
    "Rv32iFullCoreInstructionMatrixTest",
    "Rv32iBusCoreTest",
    "Rv32iInjectedBusApiTest",
    "Rv32iInjectedBusParityTest",
    "Rv32iPackageApiTest",
    "Rv32iUartHelloWorldTest"
]

[dependencies]
"Livt.IO" = "1.8.1"
